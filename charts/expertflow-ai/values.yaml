global:
  ingressRouter: "ai.expertflow.com"
  ingressCertName: "ef-ingress-tls-secret"
  ingressClassName: "nginx"
  efCxReleaseName: "ef-cx"
  efConnectionsConfigMapName: ""
  imagePullSecrets:
   - expertflow-reg-cred
   
  efCommonVars_MASK_ATTRIBUTES_PATH: /sensitive.js
  efCommonVars_LOGGING_CONFIG: /logback/logback-spring.xml
  
  REDIS_HOST: redis-thirdparty-master.ef-external.svc
  REDIS_USER: "superuser"
  REDIS_DB: "0"
  REDIS_PORT: "6379"
  REDIS_MAX_ACTIVE: "50"
  REDIS_MAX_IDLE: "50"
  REDIS_MAX_WAIT: "-1"
  REDIS_MIN_IDLE: "25"
  REDIS_SSL_ENABLED: "true"
  REDIS_CLIENT_CERT: /redis/tls.crt
  REDIS_CLIENT_KEY: /redis/tls.key
  REDIS_CA_CERT: /redis/ca.crt
  REDIS_TIMEOUT: "5000"
  REDIS_CONNECT_TIMEOUT: "300"
  REDIS_SENTINEL_ENABLE: "false"
  REDIS_SENTINEL_MASTER: expertflow
  REDIS_SENTINEL_NODES: redis-ha-node-0.redis-ha-headless.ef-external.svc.cluster.local:26379,redis-ha-node-1.redis-ha-headless.ef-external.svc.cluster.local:26379,redis-ha-node-2.redis-ha-headless.ef-external.svc.cluster.local:26379
  REDIS_SENTINEL_PASSWORD: Expertflow123
  TRUST_STORE_PASSWORD: "Expertflow123"
  KEY_STORE_PASSWORD: "Expertflow123"
  TOPIC_CONCURRENCY_MIN: "2"
  TOPIC_CONCURRENCY_MAX: "6"
  ENABLE_CLOUD_MANAGED_CONNECTIONS: "false"
  

##############################llm-connector##############################
llm-connector:
  enabled: true
  replicaCount: 1
  image:
    repository: bot/ai/ef_llm_connector
    tag: "5.5.0"
  efConnectionVars: true
  efEnvironmentVars: false
  extraEnvVarsSecret: "expertflow-ai-env"
  containerPorts:
    - name: "http-l-c-8000"
      containerPort: 8000

 
  extraEnvVars:
    - name: REDIS_HOST
      value: '{{ .Values.global.REDIS_HOST }}'
    - name: REDIS_USER
      value: '{{ .Values.global.REDIS_USER }}'
    - name: REDIS_DB
      value: '{{ .Values.global.REDIS_DB }}'
    - name: REDIS_PORT
      value: '{{ .Values.global.REDIS_PORT }}'
    - name: REDIS_SENTINEL_ENABLE
      value: '{{ .Values.global.REDIS_SENTINEL_ENABLE }}'
    - name: REDIS_SENTINEL_MASTER
      value: '{{ .Values.global.REDIS_SENTINEL_MASTER }}'
    - name: REDIS_SENTINEL_NODES
      value: '{{ .Values.global.REDIS_SENTINEL_NODES }}'
    - name: REDIS_SENTINEL_PASSWORD
      value: '{{ .Values.global.REDIS_SENTINEL_PASSWORD }}'
    - name: REDIS_TIMEOUT
      value: '{{ .Values.global.REDIS_TIMEOUT }}'
    - name: REDIS_SSL_ENABLED
      value: '{{ .Values.global.REDIS_SSL_ENABLED }}'
    - name: REDIS_MAX_ACTIVE
      value: '{{ .Values.global.REDIS_MAX_ACTIVE }}'
    - name: REDIS_MAX_IDLE
      value: '{{ .Values.global.REDIS_MAX_IDLE }}'
    - name: REDIS_MIN_IDLE
      value: '{{ .Values.global.REDIS_MIN_IDLE }}'
    - name: REDIS_MAX_WAIT
      value: '{{ .Values.global.REDIS_MAX_WAIT }}'
    - name: REDIS_CLIENT_CERT
      value: '{{ .Values.global.REDIS_CLIENT_CERT }}'
    - name: REDIS_CLIENT_KEY
      value: '{{ .Values.global.REDIS_CLIENT_KEY }}'
    - name: REDIS_CA_CERT
      value: '{{ .Values.global.REDIS_CA_CERT }}'
    - name: TENANT_SERVICE_URL
      value: "http://ef-cx-cx-tenant-svc:3000"
    - name: LOG_LEVEL
      value: "INFO"

  service:
    type: ClusterIP          
    enabled: true
    port: 8000
    portName: "http-l-c-8000"
    targetPort: "http-l-c-8000"
    

  extraVolumes:
    - name: llm-config
      configMap:
        name: ef-llm-api-config
    - name: redis-thirdparty-crt
      secret:
        secretName: redis-thirdparty-crt
    - name: expertflow-ai-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "expertflow-ai-vault"
  
  extraVolumeMounts:
    - name: llm-config
      mountPath: /app/config
    - name: redis-thirdparty-crt
      mountPath: /redis
      readOnly: true
    - name: expertflow-ai-secrets
      mountPath: /mnt/secrets-store
      readOnly: true

  ingress:
    enabled: false

##############################AI-ANALYZER##############################
ai-analyzer:
  enabled: true
  nameOverride: "analyzer"
  image:
    repository: bot/ai/ai_analyzer
    tag: "5.11.0"
  efConnectionVars: true
  efEnvironmentVars: false
  extraEnvVarsSecret: "expertflow-ai-env"
  containerPorts:
    - name: "http-a-c-5052"
      containerPort: 5052
  extraEnvVars:
    - name: REDIS_HOST
      value: '{{ .Values.global.REDIS_HOST }}'
    - name: REDIS_USER
      value: '{{ .Values.global.REDIS_USER }}'
    - name: REDIS_PORT
      value: '{{ .Values.global.REDIS_PORT }}'
    - name: REDIS_SENTINEL_ENABLE
      value: '{{ .Values.global.REDIS_SENTINEL_ENABLE }}'
    - name: REDIS_SENTINEL_MASTER
      value: '{{ .Values.global.REDIS_SENTINEL_MASTER }}'
    - name: REDIS_SENTINEL_NODES
      value: '{{ .Values.global.REDIS_SENTINEL_NODES }}'
    - name: REDIS_SENTINEL_PASSWORD
      value: '{{ .Values.global.REDIS_SENTINEL_PASSWORD }}'
    - name: REDIS_TIMEOUT
      value: '{{ .Values.global.REDIS_TIMEOUT }}'
    - name: REDIS_SSL_ENABLED
      value: '{{ .Values.global.REDIS_SSL_ENABLED }}'
    - name: REDIS_MAX_ACTIVE
      value: '{{ .Values.global.REDIS_MAX_ACTIVE }}'
    - name: REDIS_MAX_IDLE
      value: '{{ .Values.global.REDIS_MAX_IDLE }}'
    - name: REDIS_MIN_IDLE
      value: '{{ .Values.global.REDIS_MIN_IDLE }}'
    - name: REDIS_MAX_WAIT
      value: '{{ .Values.global.REDIS_MAX_WAIT }}'
    - name: REDIS_CLIENT_CERT
      value: '{{ .Values.global.REDIS_CLIENT_CERT }}'
    - name: REDIS_CLIENT_KEY
      value: '{{ .Values.global.REDIS_CLIENT_KEY }}'
    - name: REDIS_CA_CERT
      value: '{{ .Values.global.REDIS_CA_CERT }}'
    - name: ACTIVEMQ_USERNAME
      valueFrom:
        secretKeyRef:
          name: expertflow-ai-env
          key: ACTIVEMQ_USERNAME
    - name: ACTIVEMQ_PASSWORD
      valueFrom:
        secretKeyRef:
          name: expertflow-ai-env
          key: ACTIVEMQ_PASSWORD
    - name: TOPIC_CONCURRENCY_MIN
      value: '{{ .Values.global.TOPIC_CONCURRENCY_MIN }}'
    - name: TOPIC_CONCURRENCY_MAX
      value: '{{ .Values.global.TOPIC_CONCURRENCY_MAX }}'
    - name: TRUST_STORE_PASSWORD
      value: '{{ .Values.global.TRUST_STORE_PASSWORD }}'
    - name: KEY_STORE_PASSWORD
      value: '{{ .Values.global.KEY_STORE_PASSWORD }}'
    - name: LLM_API
      value: "http://expertflow-ai-llm-connector-svc.expertflow:8000/ef-llm-connector/conversation-summary"
    - name: SCHEDULER_FIXED_RATE
      value: "5000"
    - name: ASYNC_EXECUTOR_CORE
      value: "5"
    - name: ASYNC_EXECUTOR_MAX
      value: "50"
    - name: ASYNC_EXECUTOR_QUEUE
      value: "1000"
    - name: TZ
      value: '{{ .Values.global.efCommonVars_TZ }}'
    - name: LOGGING_CONFIG
      value: "classpath:logback.xml"
    - name: MASKING_LAYOUT_CLASS
      value: "com.java.analyzer.logging.MaskingPatternLayout"
    - name: LOG_LEVEL
      value: "INFO"
  service:
    enabled: true
    port: 5052
    portName: "http-a-c-5052"
    targetPort: "http-a-c-5052"
  ingress:
    enabled: false
    
  extraVolumes:
    - name: redis-thirdparty-crt
      secret:
        secretName: redis-thirdparty-crt
    - name: activemq-tls
      secret:
        secretName: activemq-tls
    - name: expertflow-ai-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "expertflow-ai-vault"
  extraVolumeMounts:
    - name: redis-thirdparty-crt
      mountPath: /redis
    - name: activemq-tls
      mountPath: /activemq
    - name: expertflow-ai-secrets
      mountPath: /mnt/secrets-store
      readOnly: true


##############################PII-MASKER##############################
pii-masker:
  enabled: true
  replicaCount: 1
  image:
    registry: gitimages.expertflow.com
    repository: bot/ai/ncri-pii-masker
    tag: "5.10.0"
  efConnectionVars: false
  efEnvironmentVars: false
  containerPorts:
    - name: "http-pm-8080"
      containerPort: 8080

  resources:
    requests:
      cpu: "4"
      memory: 6Gi
    limits:
      cpu: "4"
      memory: 8Gi

  extraEnvVars:
    - name: WEB_CONCURRENCY
      value: "1"
    - name: ONNX_THREADS
      value: "4"
    - name: PII_APP_LOG_LEVEL
      value: "INFO"
    - name: PII_APP_REQUIRE_ML_MODEL
      value: "true"
    - name: PII_APP_STRICT_MODE
      value: "true"
    - name: PII_APP_ENABLE_LEAKAGE_SCAN
      value: "true"
    - name: PII_MODEL_USE_ONNX
      value: "true"
    - name: PII_MODEL_ENABLE_ML_GATE
      value: "true"
    - name: PII_MODEL_BATCH_SIZE
      value: "16"
    - name: PII_MODEL_ENABLE_DYNAMIC_BATCH
      value: "true"
    - name: PII_MODEL_ONNX_BATCH_WAIT_MS
      value: "8"
    - name: PII_MODEL_ONNX_TIMEOUT_S
      value: "10"
    - name: PII_INTENT_ONNX_TIMEOUT_S
      value: "5"
    - name: PII_DETECTION_ENABLE_LAYER_2
      value: "true"
    - name: PII_DETECTION_ENABLE_PRESIDIO_GENERIC
      value: "false"
    - name: PII_CONVERSATION_DOB_GATE
      value: "balanced"
    - name: PII_CONVERSATION_INTENT_LOOKBACK_MESSAGES
      value: "3"
    - name: PII_CONVERSATION_PARALLEL_MODEL_BATCHES
      value: "false"
    - name: PII_INTENT_ENABLED
      value: "true"
    - name: PII_INTENT_REQUIRE_MODEL
      value: "true"
    - name: PII_VALIDATION_MODE
      value: "ml_trust"
    - name: TLDEXTRACT_CACHE
      value: "/tmp/tldextract"
    - name: XDG_CACHE_HOME
      value: "/tmp"
    - name: HF_HOME
      value: "/tmp/huggingface"

  service:
    type: ClusterIP
    enabled: true
    port: 8080
    portName: "http-pm-8080"
    targetPort: "http-pm-8080"

  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 512Mi
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  ingress:
    enabled: false
